name: Build & Deploy Fund Page

on:
  schedule:
    - cron: '30 0 * * 1-5'
    - cron: '30 4 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build page
        run: |
          python3 build.py
          mkdir -p public
          cp "元大基金淨值與表現.html" public/index.html
          cp data.json public/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
