name: Build & Deploy Fund Page

on:
  # 台北時間 08:30~23:30 每小時整（其中一格 18:00），平日；UTC = 台北 -8h
  schedule:
    - cron: '30 0-9,11-15 * * 1-5'
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - id: guard
        name: 排程觸發若已跨到週日（台北時間）就跳過（基金週末無新淨值，避免 GitHub cron 延遲跑到隔天浪費一次抓取）
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ='Asia/Taipei' date +%u)" = "7" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Build page
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 build.py
          mkdir -p public
          cp "元大基金淨值與表現.html" public/index.html
          cp data.json public/data.json
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
